<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈三中商业精英社</title>
<style>
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; height:100%; overflow:hidden; background:#0d0b09; }

  /* 全屏背景图：初始高度模糊，点击后过渡到清晰 */
  #bg{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:cover;                 /* 模糊时铺满全屏（裁剪无妨，反正看不清） */
    filter:blur(30px);
    transform:scale(1.12);            /* 放大一点，避免模糊时边缘露出白边 */
    transition:filter 1.2s ease, transform 1.2s ease;
  }
  #bg.clear{
    filter:blur(0);
    object-fit:contain;               /* 变清晰后完整显示整张图，不裁剪 */
    transform:scale(1);
  }

  /* 引导层：只显示“点击查看” */
  #overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transition:opacity .8s ease;
  }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  #overlay span{
    color:#fff;
    font-size:22px;
    letter-spacing:8px;
    text-shadow:0 0 14px rgba(0,0,0,.7);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
</style>
</head>
<body>

<img id="bg" src="c43c29baf6c7b490dbd674472b50b114.jpg" alt="">
<div id="overlay"><span>点击查看</span></div>
<audio id="audio" preload="auto"></audio>

<script>
(function(){
  'use strict';

  const AUDIO = ["petal_20260919_155531.m4a"];

  const audio = document.getElementById('audio');
  const bg = document.getElementById('bg');
  const overlay = document.getElementById('overlay');

  if (AUDIO.length){
    audio.volume = 1;
    audio.src = encodeURI(AUDIO[0]);
    // 单曲循环
    audio.addEventListener('ended', function(){
      audio.currentTime = 0;
      audio.play().catch(function(){});
    });
  }

  function play(){
    const p = audio.play();
    if (p) p.catch(function(){});
  }

  // 点击“点击查看”：背景变清晰 + 播放音乐
  overlay.addEventListener('click', function(){
    overlay.classList.add('hidden');
    bg.classList.add('clear');
    play();
  });
})();
</script>
</body>
</html>
