<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈三中商业精英社</title>
<style>
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; height:100%; overflow:hidden; background:#0d0b09; }

  /* 底层：始终高度模糊、铺满全屏（作为背景墙，不留黑边） */
  #bg-blur{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:blur(30px);
    transform:scale(1.12);
    transition:opacity 1s ease;
  }

  /* 顶层：清晰、完整显示整张图（不裁剪），点击后淡入 */
  #bg-clear{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #bg-clear.show{ opacity:1; }

  /* 引导层：只显示“点击查看” */
  #overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transition:opacity .8s ease;
  }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  #overlay span{
    color:#fff;
    font-size:22px;
    letter-spacing:8px;
    text-shadow:0 0 14px rgba(0,0,0,.7);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
</style>
</head>
<body>

<img id="bg-blur" src="c43c29baf6c7b490dbd674472b50b114.jpg" alt="">
<img id="bg-clear" src="c43c29baf6c7b490dbd674472b50b114.jpg" alt="">
<div id="overlay"><span>点击查看</span></div>
<audio id="audio" preload="auto"></audio>

<script>
(function(){
  'use strict';

  const audio = document.getElementById('audio');
  const bgClear = document.getElementById('bg-clear');
  const overlay = document.getElementById('overlay');

  audio.volume = 1;
  audio.loop = true;                       // 单曲循环
  audio.src = 'petal.mp3';                 // 兜底直连

  // 预加载：页面一打开就后台下载音频到内存，点击时立即播放
  fetch('petal.mp3')
    .then(function(r){ return r.blob(); })
    .then(function(blob){
      audio.src = URL.createObjectURL(blob);
      audio.load();
    })
    .catch(function(){ /* 下载失败则继续用上面的直连 URL */ });

  function play(){
    const p = audio.play();
    if (p) p.catch(function(){});
  }

  // 点击“点击查看”：背景变清晰 + 播放音乐
  overlay.addEventListener('click', function(){
    overlay.classList.add('hidden');
    bgClear.classList.add('show');
    play();
  });
})();
</script>
</body>
</html>
